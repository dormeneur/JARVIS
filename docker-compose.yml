services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jv-api
    ports:
      # Bind to localhost only — access via Tailscale (tailscale serve) or
      # direct LAN. Never expose on 0.0.0.0 per 06-Security-Model.md.
      - "127.0.0.1:8000:8000"
    volumes:
      - ${JARVIS_HOST_PATH:?Set JARVIS_HOST_PATH in .env}:/data/JARVIS
      # Vault zip backups. Keep this OUTSIDE the vault; ideally another disk.
      - ${JARVIS_BACKUP_HOST_PATH:-./backups}:/backups
    env_file: .env
    depends_on:
      chromadb:
        condition: service_started
    networks:
      - jarvis-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  brain:
    build:
      context: ./brain
      dockerfile: Dockerfile
    container_name: jv-brain
    volumes:
      # Read-write: approved agent tools (create/edit/move/delete) and the
      # Memory/global_index.md writer write here directly. Writes are confined
      # by tools.safe_path(), which also keeps Secrets/ and system/ unreachable.
      # (generate-files only returns a manifest; mobile writes those via jv-api.)
      - ${JARVIS_HOST_PATH:?Set JARVIS_HOST_PATH in .env}:/data/JARVIS
    # Hide the encrypted Secrets and the device registry from the brain: an empty in-memory folder is
    # laid over each, so even a bug in tools.safe_path() has nothing to reach. (On a case-insensitive
    # Windows bind mount a differently-cased spelling may still show the real folder; safe_path
    # casefolds, and it remains the primary guard.)
    tmpfs:
      - /data/JARVIS/Secrets:size=64k,mode=0555
      - /data/JARVIS/system:size=64k,mode=0555
    # Only what the brain needs. It does NOT get .env wholesale: that holds JARVIS_JWT_SECRET (enough
    # to mint admin tokens) and the jobs secret. Every field of brain/app/config.py is listed here;
    # add new settings here too. (JARVIS_HISTORY_DB is left unset on purpose: empty would not mean "default".)
    environment:
      JARVIS_VAULT_PATH: /data/JARVIS
      JARVIS_OLLAMA_URL: ${JARVIS_OLLAMA_URL:-http://host.docker.internal:11434}
      JARVIS_VECTORDB_URL: ${JARVIS_VECTORDB_URL:-http://chromadb:8000}
      JARVIS_EMBEDDING_MODEL: ${JARVIS_EMBEDDING_MODEL:-nomic-embed-text}
      JARVIS_LLM_MODEL: ${JARVIS_LLM_MODEL:-qwen3:4b}
      JARVIS_FORM_MODEL: ${JARVIS_FORM_MODEL:-}
      JARVIS_LOG_LEVEL: ${JARVIS_LOG_LEVEL:-INFO}
      JARVIS_NUM_CTX: ${JARVIS_NUM_CTX:-8192}
      JARVIS_AGENT_THINK: ${JARVIS_AGENT_THINK:-false}
      JARVIS_HYBRID_SEARCH: ${JARVIS_HYBRID_SEARCH:-true}
      JARVIS_VECTOR_BACKEND: ${JARVIS_VECTOR_BACKEND:-sqlite}
      JARVIS_MEMORY_EXTRACTION: ${JARVIS_MEMORY_EXTRACTION:-true}
      JARVIS_TRACE_TEXT: ${JARVIS_TRACE_TEXT:-false}
      JARVIS_TIMEZONE: ${JARVIS_TIMEZONE:-Asia/Kolkata}
      JARVIS_DIGEST_TIME: ${JARVIS_DIGEST_TIME:-07:30}
      JARVIS_NTFY_URL: ${JARVIS_NTFY_URL:-}
    depends_on:
      chromadb:
        condition: service_started
    # Ollama runs on the host (the normal install), reached as host.docker.internal; this line
    # makes that name work on Linux too (Docker Desktop provides it already).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - jarvis-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/brain/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: jv-chromadb
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - jarvis-internal
    restart: unless-stopped
    # ChromaDB image has no curl/wget — use service_started, not service_healthy.

  # Optional: Ollama in Docker instead of on the host. Off by default; to use it, start the stack
  # with --profile docker-ollama and set JARVIS_OLLAMA_URL=http://ollama:11434 in .env.
  ollama:
    profiles: ["docker-ollama"]
    image: ollama/ollama:latest
    container_name: jv-ollama
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - jarvis-internal
    restart: unless-stopped

  jobs:
    # Optional ai-job-search runner (DOCUMENTATION/OFFICIAL-DOCS/12-Job-Search-Integration.md).
    # Not started by a plain `docker compose up`; use:
    #   docker compose --profile jobs up -d --build
    profiles: ["jobs"]
    build:
      context: ./jobs
      dockerfile: Dockerfile
    container_name: jv-jobs
    volumes:
      # The ai-job-search workspace. The vault is deliberately NOT mounted:
      # Claude only ever sees this folder.
      - ${JARVIS_JOBS_WORKSPACE:-./.jobs-workspace-not-set}:/work
      - jobs-state:/state
      # Claude sessions, so a run paused at a question survives restarts.
      - jobs-claude:/home/jarvis/.claude
    # No `env_file: .env` here on purpose: this container gets only what it
    # needs. The Claude token lives in jobs.env, which no other service reads.
    environment:
      JARVIS_JOBS_SECRET: ${JARVIS_JOBS_SECRET:-}
      JARVIS_MAX_PARALLEL: ${JARVIS_JOBS_MAX_PARALLEL:-2}
    env_file:
      - path: jobs.env
        required: false
    networks:
      - jarvis-internal
    restart: unless-stopped

volumes:
  chroma-data:
    name: jarvis-chroma-data
  ollama-models:
    name: jarvis-ollama-models
  jobs-state:
    name: jarvis-jobs-state
  jobs-claude:
    name: jarvis-jobs-claude

networks:
  jarvis-internal:
    name: jarvis-internal
    driver: bridge
